<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>🎁 Family Secret Santa 2026</title>
<meta property="og:title" content="🎁 Family Secret Santa 2026">
<meta property="og:description" content="Your personal Secret Santa page. Tap to open.">
<style>
  html, body { margin: 0; height: 100%; background: #f6f1e7; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  iframe { position: fixed; top: 0; left: 0; width: 100%; height: calc(100% - 30px); border: 0; background: #f6f1e7; }
  .help { position: fixed; left: 0; right: 0; bottom: 0; height: 30px; line-height: 30px; padding: 0 12px; text-align: center; font-size: 12px; color: #6f6656; background: #efe7d6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
  <!--
    Short-link page for the Family Secret Santa app. It loads the app inside this page instead of
    forwarding to it. Google's Apps Script breaks ("Sorry, unable to open the file at this time")
    for visitors signed in to Google, and an embedded frame doesn't carry Google sign-in cookies:
    Chrome is told so via `credentialless`, and Firefox/Safari keep cookies apart for embedded sites.
    Stores nothing; the ?t=<code> in the address is passed straight through.
  -->
  <iframe id="app" credentialless allow="clipboard-write" title="Family Secret Santa 2026"></iframe>
  <div class="help">Page not loading? Open this link in a private/incognito window.</div>
  <script>
    document.getElementById('app').src =
      'https://script.google.com/macros/s/AKfycbw4gVSSDlFTLpfmqnG9ewELfmpxdwDLfgUMMqrMJQAxADzHoHcroI6JjRBm1JEoysaZ/exec' + location.search;
  </script>
</body>
</html>
